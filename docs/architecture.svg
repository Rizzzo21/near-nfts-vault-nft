<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="monospace">
  <rect width="920" height="440" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">VAULT-NFT — mint → fund → royalties → credential</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" fill="#555">NEAR testnet contract: vnft-backstop-1110b.testnet (deployed 2026-11-10)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Mint -->
  <rect x="30" y="110" width="160" height="90" rx="8" fill="#eef4ff" stroke="#3355aa" stroke-width="2"/>
  <text x="110" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">1 · Mint (NEP-171)</text>
  <text x="110" y="162" text-anchor="middle" font-size="11" fill="#333">token #42 → owner</text>
  <text x="110" y="178" text-anchor="middle" font-size="11" fill="#333">inventory: rig-mk3,</text>
  <text x="110" y="192" text-anchor="middle" font-size="11" fill="#333">dataset-v2</text>

  <!-- Fund -->
  <rect x="230" y="110" width="180" height="90" rx="8" fill="#fff7e6" stroke="#aa7711" stroke-width="2"/>
  <text x="320" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">2 · Fund</text>
  <text x="320" y="162" text-anchor="middle" font-size="11" fill="#333">1 NEAR in → 0.9 treasury</text>
  <text x="320" y="178" text-anchor="middle" font-size="11" fill="#333">0.1 royalty pool</text>
  <text x="320" y="192" text-anchor="middle" font-size="11" fill="#333">(90% / 10% split)</text>

  <!-- Royalties -->
  <rect x="450" y="110" width="180" height="90" rx="8" fill="#eaffea" stroke="#227722" stroke-width="2"/>
  <text x="540" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">3 · Royalties (NEP-199)</text>
  <text x="540" y="162" text-anchor="middle" font-size="11" fill="#333">pool 0.1 → 0.07 creator</text>
  <text x="540" y="178" text-anchor="middle" font-size="11" fill="#333">0.03 co-author (70/30)</text>
  <text x="540" y="192" text-anchor="middle" font-size="11" fill="#333">pool → 0</text>

  <!-- Credential -->
  <rect x="670" y="110" width="180" height="90" rx="8" fill="#fdeaea" stroke="#aa2222" stroke-width="2"/>
  <text x="760" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">4 · Credential</text>
  <text x="760" y="162" text-anchor="middle" font-size="11" fill="#333">sha256(#42:scope:owner)</text>
  <text x="760" y="178" text-anchor="middle" font-size="11" fill="#333">owner: ok=true</text>
  <text x="760" y="192" text-anchor="middle" font-size="11" fill="#333">stale owner: REFUSED</text>

  <!-- Token-bound subaccount -->
  <rect x="300" y="270" width="320" height="110" rx="8" fill="#f0eaff" stroke="#6622aa" stroke-width="2"/>
  <text x="460" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Token-bound subaccount vault-42.nft.near</text>
  <text x="460" y="322" text-anchor="middle" font-size="11" fill="#333">treasury 0.9 NEAR · royalty pool 0 · inventory rig-mk3, dataset-v2</text>
  <text x="460" y="338" text-anchor="middle" font-size="11" fill="#333">credential bound to current owner; transfer clears it</text>
  <text x="460" y="354" text-anchor="middle" font-size="11" fill="#333">after transfer to buyer: old owner presentation refused</text>
  <text x="460" y="370" text-anchor="middle" font-size="11" fill="#333">(signer_not_current_owner)</text>

  <!-- Arrows -->
  <line x1="190" y1="155" x2="228" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="155" x2="448" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="630" y1="155" x2="668" y2="155" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="200" x2="760" y2="235" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="252" x2="470" y2="268" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="690" y="228" text-anchor="middle" font-size="11" fill="#333">binds</text>
  <text x="545" y="252" text-anchor="middle" font-size="11" fill="#333">owns</text>

  <text x="460" y="420" text-anchor="middle" font-size="11" fill="#777">On-chain amounts are testnet NEAR; the demo model is 2,000 USDC gross → 1,800 treasury / 200 pool → 140 creator / 60 co-author through the same split logic. Royalty payouts are recorded in the contract internal ledger.</text>
</svg>
